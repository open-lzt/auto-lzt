name: CI

# The published default branch is `main` — the trigger must name it or pushes run no CI.
# workflow_dispatch lets CI be proven on demand instead of by pushing a commit and reading the tab.
on:
  push:
    branches: [main, "feat/**"]
  pull_request:
  workflow_dispatch:

# Read-only by default. A fork's pull_request token is read-only regardless, but a push to
# `feat/**` runs repository code — including `pnpm install`, which executes dependency build
# scripts — and would otherwise inherit whatever the repo default is. If that default is the
# legacy read-write token, that build script holds a token that can push to main.
permissions:
  contents: read

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Full-history scan for committed credentials/tokens. Runs first and standalone — no build
      # dependency, so a leaked secret fails fast before any install/build step executes.
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Set up Python
        run: uv python install 3.12
      - name: Sync deps
        run: uv sync --extra dev --frozen
      - name: Ruff
        run: uv run ruff check .
      - name: Ruff format
        run: uv run ruff format --check .
      - name: Mypy
        run: uv run mypy app
      - name: Pytest
        run: uv run pytest --cov=app --cov-report=term-missing
      # Fails the build on a known-vulnerable dependency in the locked resolution — the same
      # `uv.lock` that ships to prod, not a fresh unlocked resolve.
      - name: Export locked requirements
        run: uv export --extra dev --frozen --no-emit-project --format requirements-txt -o requirements-audit.txt
      - name: pip-audit
        run: uvx pip-audit --strict -r requirements-audit.txt

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          # 11, not 9: the UI kit is a git dependency that builds itself on install, and pnpm 10+
          # will not run a dependency's build script unless it is allow-listed. That allow-list
          # (`allowBuilds` in pnpm-workspace.yaml) is a pnpm 11 key — pnpm 9 ignored it silently,
          # left the kit unbuilt, and every import from it failed typecheck with "no exported
          # member". The installer provisions pnpm 11, so CI matching it is the point.
          version: 11
      - uses: actions/setup-node@v4
        with:
          # pnpm 11 refuses to start on anything below 22.13 (it imports node:sqlite).
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm exec tsc --noEmit
      # The gate this job was missing entirely. Typecheck and build both pass with a broken login
      # gate or an SSE stream that never reconnects — types stay correct while behaviour rots. 24
      # test files were tracked and none of them had ever run here.
      - name: Test
        run: pnpm test
      - name: Build
        run: pnpm build

  # `@pytest.mark.pg` tests (migrations, run-key races) need a real Postgres — pyproject.toml's
  # addopts excludes them from the default `build` run, so this is the only place they execute.
  pg-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: lzt
          POSTGRES_PASSWORD: lzt
          POSTGRES_DB: lztflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Set up Python
        run: uv python install 3.12
      - name: Sync deps
        run: uv sync --extra dev --frozen
      - name: Pytest (pg)
        env:
          LZT_FLOW_DATABASE_URL: postgresql+asyncpg://lzt:lzt@localhost:5432/lztflow
        run: uv run pytest -m pg -q

  # Final gate: the no-Docker core loop against the mock market. No live token, no external
  # services — proves compile -> run -> completed on every commit (closes the open CI question).
  smoke:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Set up Python
        run: uv python install 3.12
      - name: Sync deps
        run: uv sync --extra dev --frozen
      - name: Smoke (mock-backed core loop)
        run: bash scripts/smoke.sh
