server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # No third-party scripts/styles/fonts and no iframe embedding anywhere in this SPA — the
    # policy below is a hard allowlist of 'self' rather than a report-only draft. connect-src
    # covers both the JSON fetches and the /api/* SSE stream (EventSource honours connect-src,
    # not a separate directive). frame-ancestors replaces X-Frame-Options for modern browsers;
    # X-Frame-Options stays for the handful that don't read CSP.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Same /api prefix-strip proxy as the Vite dev server (vite.config.ts) — the SPA never
    # hardcodes a backend host, dev and prod both go through /api.
    location /api/ {
        proxy_pass http://api:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        try_files $uri /index.html;
    }
}
